schema_version: 1
tool_version: v2.3.0
tool_checksums_sha256: 639af50cddd7dbcc45561a067dd0f361abbddaf1ba5810c680b4fc5b0ba2c10b
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: .verification
mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
    - module: .
      mode: apidiff
      path: api/v3-baseline.txt
operations:
  - module: .
    gate: local-test
    steps:
      - type: go-test
        packages: [.]
        run: '^Test(WorkerShutdownJoinsEveryOwnedProcessorGoroutine|OrchestrationPersistsTheFirstObservedRaceWinner)$'
        race: true
        count: 1
        timeout: 2m
  - module: .
    gate: docs
    steps:
      - type: make
        makefile: verification/package.mk
        target: docs
        timeout: 5m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzActivityRequestValidation$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzActivityOutcomeValidation$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzActivityDispatchBoundaries$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzChildDispatchBoundaries$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzChildStartRequestBoundaries$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzCompensationDispatchBoundaries$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzHistoryEventValidation$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzActivityHistoryEventValidation$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzOperatorAuditBoundaries$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzPendingWorkValidation$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzTransitionValidation$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzSignalAcceptanceBoundaries$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzWorkLeaseBoundaries$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzWorkDecisionBoundaries$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./postgres]
        fuzz: '^FuzzScanHistoryEvent$'
        budget: 10000x
        timeout: 20m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: [./...]
        benchmark: .
        budget: 1s
        timeout: 20m
  - module: .
    gate: interoperability
    steps:
      - type: make
        makefile: verification/package.mk
        target: interoperability
        timeout: 20m
